<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChikChirik — найдите фотографа или видеографа</title>
<meta name="description" content="Опишите задачу — фотографы, видеографы и монтажёры откликнутся сами. Для заказчиков бесплатно.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E9A15F">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" as="image" href="/assets/go-hero-720.jpg" media="(max-width: 899px)">
<link rel="preload" as="image" href="/assets/go-hero.webp" media="(min-width: 900px)">
<link rel="stylesheet" href="/assets/site.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:#0B0B0C;font-family:var(--font-text,system-ui,sans-serif);-webkit-text-size-adjust:100%}
  a{color:inherit}
  .page{min-height:100svh;display:flex;flex-direction:column}
  .hero{position:relative;height:56svh;min-height:340px;overflow:hidden;background:#E9A15F}
  .hero picture,.hero picture img{width:100%;height:100%;display:block}
  .hero picture img{object-fit:cover;object-position:38% 50%}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 26%)}
  .logo{position:absolute;z-index:2;top:calc(18px + env(safe-area-inset-top));left:20px;height:24px;width:auto}
  .sheet{position:relative;z-index:3;margin-top:-28px;background:#fff;border-radius:28px 28px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;flex:1}
  .badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:#EEF4FF;color:var(--blue-600,#003CD3);font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px}
  .badge i{width:6px;height:6px;border-radius:50%;background:var(--blue-500,#0057FF)}
  h1{margin:2px 0 0;font-family:var(--font-display,Georgia,serif);font-size:clamp(30px,8.4vw,52px);line-height:1.02;letter-spacing:-.025em;font-weight:800}
  .lead{margin:0;font-size:17px;line-height:1.45;color:#5B5C61}
  .actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:18px;font-size:17px;font-weight:600;text-decoration:none;border:0;cursor:pointer;width:100%;font-family:inherit;transition:transform .15s ease,background .15s ease}
  .btn:active{transform:scale(.98)}
  .btn-tg{background:var(--blue-500,#0057FF);color:#fff;box-shadow:0 10px 24px -10px rgba(0,87,255,.6)}
  .btn-tg:hover{background:var(--blue-600,#003CD3)}
  .btn-app{background:#F3F3F4;color:#0B0B0C}
  .btn-app:hover{background:#EAEAEB}
  .stores{display:none;gap:10px}
  .stores .btn{font-size:15px}
  .ic{width:22px;height:22px;flex:none}
  .trouble{display:none;align-self:center;background:none;border:0;padding:6px;font:inherit;font-size:14px;color:#5B5C61;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .help{display:none;background:#FFF7E6;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.45}
  .help.show{display:block}
  .help p{margin:0 0 10px}
  .help .row{display:flex;gap:8px;flex-wrap:wrap}
  .help button,.help a{height:38px;padding:0 14px;border-radius:12px;border:1px solid #EBDDB8;background:#fff;font:inherit;font-size:14px;font-weight:600;color:#000;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
  @media (min-width:900px){
    .page{flex-direction:row-reverse;align-items:stretch;padding:24px;gap:24px;min-height:100vh}
    .hero{flex:1.1;height:auto;min-height:0;border-radius:28px}
    .hero::after{display:none}
    .logo-m{display:none}
    .sheet{margin:0;border-radius:0;flex:1;justify-content:center;padding:40px 56px;max-width:620px;gap:18px}
    .logo-d{display:block!important;height:28px;width:auto;align-self:flex-start;margin-bottom:28px}
    .actions{max-width:420px}
  }
</style>
</head>
<body>
<noscript><div><img src="https://mc.yandex.ru/watch/113654864" style="position:absolute;left:-9999px" alt=""></div></noscript>
<div class="page">
  <div class="hero">
    <picture>
      <source media="(min-width: 900px)" srcset="/assets/go-hero.webp" type="image/webp">
      <img src="/assets/go-hero-720.jpg" alt="Девушка с телефоном в кресле" width="720" height="816" fetchpriority="high">
    </picture>
    <a href="/" class="logo-m"><img class="logo" src="/assets/logo-wordmark-white.png" alt="ChikChirik"></a>
  </div>
  <main class="sheet">
    <img class="logo-d" src="/assets/logo-wordmark.png" alt="ChikChirik" style="display:none">
    <span class="badge"><i></i>Бесплатно для заказчиков</span>
    <h1>Быстрый поиск креативных специалистов</h1>
    <p class="lead">Опишите задачу — исполнители откликнутся сами.</p>

    <div class="actions">
      <a class="btn btn-tg" id="tg" href="https://t.me/Chikchirik_bird_bot">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.6 19.9c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L5.9 13.4l-4.9-1.5c-1.1-.3-1.1-1.1.2-1.6L20.4 2.9c.9-.3 1.7.2 1.5 1.4z"/></svg>
        Открыть в Telegram
      </a>
      <a class="btn btn-app" id="app" href="https://apps.apple.com/kz/app/chikchirik/id6802269556">Скачать приложение</a>
      <div class="stores" id="stores">
        <a class="btn btn-app" id="ios" href="https://apps.apple.com/kz/app/chikchirik/id6802269556">App Store</a>
        <a class="btn btn-app" id="android" href="https://play.google.com/store/apps/details?id=com.chikchirik.chikchirikApp">Google Play</a>
      </div>
    </div>

    <button type="button" class="trouble" id="trouble">Не открывается Telegram?</button>
    <div class="help" id="help">
      <p><b>Telegram не открылся?</b> Нажмите <b>⋯</b> вверху справа → «Открыть в браузере» и попробуйте снова. Или скопируйте ссылку.</p>
      <div class="row">
        <button type="button" id="copy">Скопировать ссылку</button>
        <a id="web" href="https://t.me/Chikchirik_bird_bot">Открыть t.me</a>
      </div>
    </div>
  </main>
</div>
<script>
(function () {
  var MID = 113654864, BOT = 'Chikchirik_bird_bot';
  var APPSTORE = 'https://apps.apple.com/app/apple-store/id6802269556';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.chikchirik.chikchirikApp';

  // метка: ?ref=ref_cinema_kz (или ?ref=cinema_kz); по умолчанию ref_site_go
  var q = new URLSearchParams(location.search);
  var raw = (q.get('ref') || q.get('utm_campaign') || 'site_go').replace(/^ref_/, '');
  if (!/^[A-Za-z0-9_]{1,50}$/.test(raw)) raw = 'site_go';
  var ref = 'ref_' + raw, ct = raw;
  var src = q.get('utm_source') || 'go';

  var ua = navigator.userAgent || '';
  var android = /Android/.test(ua);
  var ios = !android && (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));
  var inApp = /Instagram|FBAN|FBAV|FB_IAB|Threads|TikTok|musical_ly/.test(ua);

  var tme = 'https://t.me/' + BOT + '?startapp=' + ref;
  var tgScheme = 'tg://resolve?domain=' + BOT + '&startapp=' + ref;
  var intent = 'intent://resolve?domain=' + BOT + '&startapp=' + ref +
    '#Intent;scheme=tg;package=org.telegram.messenger;S.browser_fallback_url=' + encodeURIComponent(tme) + ';end';
  var iosUrl = APPSTORE + '?pt=129211385&ct=' + encodeURIComponent(ct) + '&mt=8';
  var playUrl = PLAY + '&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=go&utm_campaign=' + ct);

  var tg = document.getElementById('tg');
  // ссылка по умолчанию: t.me (работает на компьютере и в обычном браузере)
  tg.href = tme;
  document.getElementById('web').href = tme;
  document.getElementById('ios').href = iosUrl;
  document.getElementById('android').href = playUrl;
  var app = document.getElementById('app');
  if (ios) app.href = iosUrl;
  else if (android) app.href = playUrl;
  else { app.style.display = 'none'; document.getElementById('stores').style.display = 'flex'; }

  // Метрика
  window.ym = window.ym || function () { (ym.a = ym.a || []).push(arguments); }; ym.l = 1 * new Date();
  ym(MID, 'init', { clickmap: true, trackLinks: true, accurateTrackBounce: true, params: { go_ref: ref, in_app: inApp } });
  var s = document.createElement('script'); s.async = 1; s.src = 'https://mc.yandex.ru/metrika/tag.js?id=' + MID; document.head.appendChild(s);
  function goal(name, p) { try { ym(MID, 'reachGoal', name, p); } catch (e) {} }

  var help = document.getElementById('help');
  tg.addEventListener('click', function (e) {
    goal('go_tg_click', { ref: ref, in_app: inApp, os: ios ? 'ios' : android ? 'android' : 'desktop' });
    if (ios || android) {
      // в мобильном браузере и во встроенном браузере Instagram — сразу в приложение Telegram
      e.preventDefault();
      var left = false;
      var onHide = function () { if (document.hidden) left = true; };
      document.addEventListener('visibilitychange', onHide);
      location.href = android ? intent : tgScheme;
      setTimeout(function () {
        document.removeEventListener('visibilitychange', onHide);
        if (!left) { help.classList.add('show'); goal('go_tg_fail', { ref: ref, in_app: inApp }); }
      }, 1800);
    }
  });

  function storeClick(store) { return function () { goal('store_click', { store: store, page: '/go', ref: ref }); }; }
  app.addEventListener('click', storeClick(ios ? 'app_store' : 'google_play'));
  document.getElementById('ios').addEventListener('click', storeClick('app_store'));
  document.getElementById('android').addEventListener('click', storeClick('google_play'));

  document.getElementById('copy').addEventListener('click', function () {
    var b = this;
    var done = function () { b.textContent = 'Ссылка скопирована'; goal('go_copy', { ref: ref }); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tme).then(done, function () { prompt('Скопируйте ссылку:', tme); });
    else prompt('Скопируйте ссылку:', tme);
  });

  var trouble = document.getElementById('trouble');
  trouble.addEventListener('click', function () { help.classList.add('show'); trouble.style.display = 'none'; });
  if (inApp) trouble.style.display = 'block'; // во встроенном браузере — ссылка «Не открывается?»
})();
</script>
</body>
</html>
