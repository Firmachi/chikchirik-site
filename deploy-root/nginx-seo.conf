# SEO/безопасность для chikchirik.kz — добавить в конфиг nginx.

# 1) www → без www (http и https)
server {
    listen 80;
    server_name www.chikchirik.kz;
    return 301 https://chikchirik.kz$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.chikchirik.kz;
    # ssl_certificate / ssl_certificate_key — те же, что у основного сервера
    return 301 https://chikchirik.kz$request_uri;
}

